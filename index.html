<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Job Apply" />
  <meta name="theme-color" content="#0e0e0f" id="theme-meta" />
  <link rel="manifest" href="./manifest.json" />
  <title>Apply — Arham</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #0e0e0f;
      --surface: #191a1c;
      --border: #2a2b2e;
      --accent: #5b6af7;
      --text: #f0f0f0;
      --muted: #7a7b80;
      --note-bg: #141820;
      --note-border: #1e2a40;
      --note-text: #7aa8ff;
      --note-strong: #aac4ff;
    }

    html.light {
      --bg: #f5f5f3;
      --surface: #ffffff;
      --border: #e0e0dc;
      --accent: #4a58e8;
      --text: #111111;
      --muted: #888884;
      --note-bg: #eef2ff;
      --note-border: #c7d2fe;
      --note-text: #4338ca;
      --note-strong: #3730a3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      padding: 0 0 80px;
      transition: background 0.2s, color 0.2s;
    }

    header {
      padding: 52px 24px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .header-left .logo {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    h1 span {
      color: var(--accent);
    }

    /* theme toggle */
    .theme-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }

    .form {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 14px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
      -webkit-appearance: none;
    }

    input:focus,
    textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      line-height: 1.6;
    }

    ::placeholder {
      color: var(--muted);
    }

    .role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .role-btn {
      padding: 11px 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.18s;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }

    .role-btn.odoo.active {
      background: #2a1f4a;
      color: #c3b5ff;
      border-color: #5b3fcc55;
    }

    .role-btn.py.active {
      background: #0f2e25;
      color: #8ff0c8;
      border-color: #8ff0c855;
    }

    .role-btn.custom.active {
      background: #1a1f2e;
      color: #7aa8ff;
      border-color: #3a5fff55;
    }

    html.light .role-btn.odoo.active {
      background: #ede9fe;
      color: #5b21b6;
      border-color: #8b5cf6;
    }

    html.light .role-btn.py.active {
      background: #d1fae5;
      color: #065f46;
      border-color: #10b981;
    }

    html.light .role-btn.custom.active {
      background: #dbeafe;
      color: #1d4ed8;
      border-color: #3b82f6;
    }

    #custom-fields {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .preview-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.7;
      white-space: pre-wrap;
      font-family: 'DM Mono', monospace;
      transition: background 0.2s;
    }

    .preview-label {
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .send-btn {
      width: 100%;
      padding: 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s, transform 0.1s;
    }

    .send-btn:active {
      opacity: 0.85;
      transform: scale(0.98);
    }

    .file-picker-btn {
      width: 100%;
      padding: 13px 14px;
      background: var(--surface);
      border: 1px dashed var(--border);
      color: var(--muted);
      border-radius: 10px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.2s, transform 0.1s;
    }
    .file-picker-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .file-picker-btn:active {
      transform: scale(0.99);
    }
    .file-picker-btn.selected {
      border-style: solid;
      background: #141820;
      border-color: #5b6af755;
      color: var(--note-text);
    }
    html.light .file-picker-btn.selected {
      background: #ede9fe;
      border-color: #8b5cf6;
      color: #5b21b6;
    }

    .note {
      background: var(--note-bg);
      border: 1px solid var(--note-border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      color: var(--note-text);
      line-height: 1.6;
      transition: background 0.2s;
    }

    .note strong {
      color: var(--note-strong);
    }

    .divider {
      height: 1px;
      background: var(--border);
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .toggle-row span {
      font-size: 13px;
      color: var(--muted);
    }

    .toggle-arrow {
      font-size: 12px;
      color: var(--muted);
      transition: transform 0.2s;
    }

    .toggle-arrow.open {
      transform: rotate(180deg);
    }

    #preview-section {
      display: none;
      margin-top: 12px;
    }

    /* PWA install banner */
    #install-banner {
      display: none;
      margin: 0 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      align-items: center;
      gap: 12px;
    }

    #install-banner span {
      font-size: 13px;
      color: var(--muted);
      flex: 1;
      line-height: 1.5;
    }

    #install-banner span strong {
      color: var(--text);
      font-weight: 500;
    }

    .install-btn {
      padding: 8px 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .dismiss-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
  </style>
</head>

<body>

  <header>
    <div class="header-left">
      <div class="logo">Arham · Job Apply</div>
      <h1>Send <span>application</span></h1>
    </div>
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle theme">🌙</button>
  </header>

  <div class="form">

    <div id="install-banner">
      <span><strong>Add to Home Screen</strong><br>Install this app for quick access</span>
      <button class="install-btn" onclick="installPWA()">Install</button>
      <button class="dismiss-btn" onclick="dismissBanner()">✕</button>
    </div>

    <div class="field">
      <label>Type</label>
      <div class="role-grid">
        <button class="role-btn odoo active" onclick="setRole('odoo', this)">Odoo Dev</button>
        <button class="role-btn py" onclick="setRole('py', this)">Python Backend</button>
        <button class="role-btn custom" onclick="setRole('custom', this)">Custom</button>
      </div>
    </div>

    <!-- Template fields -->
    <div id="template-fields" style="display:flex;flex-direction:column;gap:16px;">
      <div class="field">
        <label>Recipient email</label>
        <input type="email" id="to-email" placeholder="hr@company.com" oninput="refresh()" />
      </div>
      <div class="field">
        <label>Recipient name <span style="color:var(--border)">(optional)</span></label>
        <input type="text" id="to-name" placeholder="Hiring Team" oninput="refresh()" />
      </div>
      <div class="divider"></div>
      <div>
        <div class="toggle-row" onclick="togglePreview()">
          <span>Preview email before sending</span>
          <span class="toggle-arrow" id="arrow">▼</span>
        </div>
        <div id="preview-section">
          <div class="preview-label" style="margin-top:12px;">Subject</div>
          <div class="preview-box" id="prev-subject"></div>
          <div class="preview-label" style="margin-top:12px;">Body</div>
          <div class="preview-box" id="prev-body"></div>
        </div>
      </div>
      <div class="divider"></div>
    </div>

    <!-- Custom fields -->
    <div id="custom-fields">
      <div class="field">
        <label>Recipient email</label>
        <input type="email" id="c-to-email" placeholder="hr@company.com" />
      </div>
      <div class="field">
        <label>Subject</label>
        <input type="text" id="c-subject" placeholder="Application for XYZ Position" />
      </div>
      <div class="field">
        <label>Body</label>
        <textarea id="c-body" rows="12" placeholder="Write your full email here..."></textarea>
      </div>
      <div class="divider"></div>
    </div>

    <!-- File picker field -->
    <div class="field" style="margin-bottom: 8px;">
      <label>Resume PDF (Optional Attachment)</label>
      <input type="file" id="resume-file" accept="application/pdf" onchange="onFileSelected(); refresh();" style="display: none;" />
      <button class="file-picker-btn" onclick="document.getElementById('resume-file').click()" id="file-label-btn">
        <span>📎</span> Select custom resume PDF...
      </button>
    </div>

    <div class="note">
      <strong>How it works:</strong> Tap the button below to compose. If your browser supports it, the PDF will be attached automatically!
    </div>

    <button class="send-btn" onclick="openGmail()">Open Gmail with this email →</button>

  </div>

  <script>
    let role = 'odoo';
    let deferredPrompt = null;

    /* ── Theme ── */
    function applyTheme(mode) {
      document.documentElement.classList.toggle('light', mode === 'light');
      document.getElementById('theme-btn').textContent = mode === 'light' ? '🌙' : '☀️';
      document.getElementById('theme-meta').setAttribute('content', mode === 'light' ? '#f5f5f3' : '#0e0e0f');
      localStorage.setItem('theme', mode);
    }
    function toggleTheme() {
      const current = document.documentElement.classList.contains('light') ? 'light' : 'dark';
      applyTheme(current === 'light' ? 'dark' : 'light');
    }
    applyTheme(localStorage.getItem('theme') || 'dark');

    /* ── PWA ── */
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-banner').style.display = 'flex';
    });
    window.addEventListener('appinstalled', () => {
      document.getElementById('install-banner').style.display = 'none';
    });
    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
        document.getElementById('install-banner').style.display = 'none';
      }
    }
    function dismissBanner() {
      document.getElementById('install-banner').style.display = 'none';
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    /* ── Role ── */
    function setRole(r, btn) {
      role = r;
      document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const isCustom = r === 'custom';
      document.getElementById('template-fields').style.display = isCustom ? 'none' : 'flex';
      document.getElementById('custom-fields').style.display = isCustom ? 'flex' : 'none';
      refresh();
    }

    function getName() { return document.getElementById('to-name').value.trim() || 'Hiring Team'; }

    function getSubject() {
      if (role === 'odoo') return 'Application for Odoo Developer Position';
      return 'Application for Python Backend Developer Position';
    }

    function getBody() {
      const name = getName();
      if (role === 'odoo') {
        return `Dear ${name},\n\nI hope this email finds you well.\n\nI am writing to express my interest in the Odoo Developer role at your organization. I am an Odoo / Python Developer with 2 years of experience designing, developing, and customizing cloud-native ERP solutions using the Odoo framework (v12/v16/v18).\n\nCurrently, I work as an Associate Software Developer at Binary Semantics Ltd. My technical experience includes:\n- Odoo ERP Customization: Designing custom modules, QWeb templates, and XML/JS views using Python ORM.\n- API & Integrations: Integrating third-party verification and tracking APIs (ULIP, PAN, DL, Google Maps) with backend platforms.\n- Data Engineering & Optimization: Architecting config-driven Airflow ETL pipelines and migrating file storage to AWS S3, reducing database size by 60%.\n- Cloud Infrastructure: Deploying and containerizing backend services on AWS EC2 using Docker and Jenkins CI/CD.\n\nI would welcome the opportunity to discuss how my background aligns with your team's requirements. Please find my resume attached for your review.\n\nThank you for your time and consideration. I look forward to hearing from you.\n\nWarm regards,\nMohammad Arham\nOdoo / Python Developer\n+91 9557385029`;
      }
      return `Dear ${name},\n\nI hope this email finds you well.\n\nI am writing to express my interest in the Python Backend Engineer role. I am a Python Backend Engineer with 2 years of experience architecting scalable, cloud-native backend systems, high-performance REST APIs, and automated data pipelines.\n\nCurrently, I am working as an Associate Software Developer at Binary Semantics Ltd., where my core technical achievements include:\n- Backend & APIs: Engineering high-throughput asynchronous FastAPI microservices and Flask platforms (achieving sub-50ms p95 response times).\n- Data Engineering: Designing config-driven ETL pipelines using Apache Airflow to replicate PostgreSQL data to AWS Athena/Redshift, reducing latency to 15-minute near real-time intervals.\n- Cloud & Optimization: Migrating binary storage to AWS S3, reducing database size by 60%, and deploying containerized services (Docker/Jenkins CI/CD) behind Nginx on AWS EC2.\n- AI Integration: Integrating Rasa NLU chatbots with REST webhooks mapping user intents to business logic actions.\n\nI would welcome the opportunity to discuss how my skills and experience can contribute to your team. Please find my resume attached for your review.\n\nThank you for your time and consideration. I look forward to the possibility of connecting further.\n\nWarm regards,\nMohammad Arham\nPython Backend Engineer\n+91 9557385029`;
    }

    function refresh() {
      if (role !== 'custom') {
        document.getElementById('prev-subject').textContent = getSubject();
        document.getElementById('prev-body').textContent = getBody();
      }
      updateNote();
    }
    
    function onFileSelected() {
      const fileInput = document.getElementById('resume-file');
      const btn = document.getElementById('file-label-btn');
      if (fileInput.files.length > 0) {
        btn.innerHTML = `<span>📄</span> ${fileInput.files[0].name}`;
        btn.classList.add('selected');
      } else {
        btn.innerHTML = `<span>📎</span> Select custom resume PDF...`;
        btn.classList.remove('selected');
      }
    }

    function canShareFiles() {
      if (!navigator.share || !navigator.canShare) return false;
      try {
        const file = new File(["test"], "test.pdf", { type: "application/pdf" });
        return navigator.canShare({ files: [file] });
      } catch (e) {
        return false;
      }
    }

    function updateNote() {
      const noteBox = document.querySelector('.note');
      const fileInput = document.getElementById('resume-file');
      const hasFile = fileInput && fileInput.files.length > 0;
      const isCustom = role === 'custom';
      
      const canShare = canShareFiles();
      
      if (canShare && (hasFile || !isCustom)) {
        noteBox.innerHTML = `<strong>How it works:</strong> Tap the button below to open the share menu, then choose <strong>Gmail</strong>. The resume PDF will be attached, and the email pre-filled. The recipient email is copied to your clipboard—simply paste it into the <strong>To</strong> field!`;
      } else {
        noteBox.innerHTML = `<strong>How it works:</strong> Tap the button below to compose. The recipient, subject, and body will pre-fill (and the body will be copied to your clipboard as backup). In Gmail, tap the attachment icon (📎), choose your resume PDF, and send!`;
      }
    }

    refresh();

    function togglePreview() {
      const sec = document.getElementById('preview-section');
      const arrow = document.getElementById('arrow');
      const open = sec.style.display === 'block';
      sec.style.display = open ? 'none' : 'block';
      arrow.classList.toggle('open', !open);
      refresh();
    }

    async function openGmail() {
      let to, subject, body;
      if (role === 'custom') {
        to = document.getElementById('c-to-email').value.trim();
        subject = document.getElementById('c-subject').value.trim();
        body = document.getElementById('c-body').value.trim();
        if (!to) { alert('Please enter the recipient email.'); return; }
        if (!subject) { alert('Please enter a subject.'); return; }
        if (!body) { alert('Please write your email body.'); return; }
      } else {
        to = document.getElementById('to-email').value.trim();
        subject = getSubject();
        body = getBody();
        if (!to) { alert('Please enter the recipient email.'); return; }
      }

      const fileInput = document.getElementById('resume-file');
      let file = null;

      // 1. Use manually selected file if present
      if (fileInput && fileInput.files.length > 0) {
        file = fileInput.files[0];
      }
      // 2. Otherwise, try to auto-load the correct resume PDF for the role
      else if (role !== 'custom') {
        try {
          const fileName = role === 'odoo' ? 'arham_odoo_2y.pdf' : 'arham_python_2y.pdf';
          const response = await fetch(`./${fileName}`);
          if (response.ok) {
            const blob = await response.blob();
            file = new File([blob], fileName, { type: 'application/pdf' });
          }
        } catch (e) {
          console.warn("Auto-fetch resume failed:", e);
        }
      }

      // 3. Try to use Web Share API
      if (file && canShareFiles()) {
        const shareData = {
          files: [file],
          title: subject,
          text: body
        };

        if (navigator.canShare(shareData)) {
          const sendBtn = document.querySelector('.send-btn');
          const originalText = sendBtn.textContent;
          sendBtn.textContent = "Opening Gmail...";
          sendBtn.disabled = true;

          try {
            // Copy recipient to clipboard
            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(to);
            }
            await navigator.share(shareData);
            sendBtn.textContent = originalText;
            sendBtn.disabled = false;
            return;
          } catch (err) {
            console.warn("Sharing aborted or failed, falling back to mailto link:", err);
            sendBtn.textContent = originalText;
            sendBtn.disabled = false;
          }
        }
      }

      // 4. Fallback: standard mailto link
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(body).catch(() => {});
      }
      window.location.href = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    }
  </script>
</body>

</html>
