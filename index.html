<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Job Apply" />
  <meta name="theme-color" content="#0e0e0f" id="theme-meta" />
  <link rel="manifest" href="./manifest.json" />
  <title>Apply — Arham</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #131313;
      --border: #232323;
      --accent: #6366f1;
      --text: #f4f4f5;
      --muted: #8a8a8e;
    }

    html.light {
      --bg: #fafafa;
      --surface: #ffffff;
      --border: #e4e4e7;
      --accent: #4f46e5;
      --text: #09090b;
      --muted: #71717a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 0 0 calc(24px + env(safe-area-inset-bottom));
      transition: background 0.2s, color 0.2s;
    }

    header {
      padding: 40px 24px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .header-left .logo {
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      font-family: 'Outfit', sans-serif;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    h1 span {
      color: var(--accent);
    }

    /* theme toggle */
    .theme-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s, border-color 0.2s, transform 0.1s;
      flex-shrink: 0;
    }
    
    .theme-btn:active {
      transform: scale(0.92);
    }

    .form {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      font-family: 'Outfit', sans-serif;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s, color 0.2s;
      -webkit-appearance: none;
    }

    input:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    textarea {
      resize: vertical;
      line-height: 1.6;
    }

    ::placeholder {
      color: var(--muted);
      opacity: 0.7;
    }

    .role-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .role-btn {
      padding: 12px 6px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 13px;
      font-weight: 500;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s ease;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }

    .role-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    #custom-fields {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .preview-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      font-size: 13px;
      color: var(--text);
      line-height: 1.7;
      white-space: pre-wrap;
      font-family: 'DM Mono', monospace;
      transition: background 0.2s;
    }

    .preview-label {
      font-size: 10px;
      font-weight: 600;
      font-family: 'Outfit', sans-serif;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    /* Sticky Action Bar at the Bottom */
    .sticky-action-bar {
      position: sticky;
      top: 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      z-index: 999;
      transition: background 0.2s, border-color 0.2s;
    }

    .role-btn.send-btn {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .role-btn.send-btn:active {
      transform: scale(0.97);
    }

    .file-picker-btn {
      width: 100%;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px dashed var(--border);
      color: var(--muted);
      border-radius: 12px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.2s, transform 0.1s;
    }

    .file-picker-btn:hover {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(99, 102, 241, 0.03);
    }

    .file-picker-btn:active {
      transform: scale(0.99);
    }

    .file-picker-btn.selected {
      border-style: solid;
      border-color: var(--accent);
      color: var(--text);
    }

.divider {
      height: 1px;
      background: var(--border);
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .toggle-row span {
      font-size: 13px;
      color: var(--muted);
    }

    .toggle-arrow {
      font-size: 12px;
      color: var(--muted);
      transition: transform 0.2s;
    }

    .toggle-arrow.open {
      transform: rotate(180deg);
    }

    #preview-section {
      display: none;
      margin-top: 12px;
    }

    /* Toast styles */
    .toast {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      visibility: hidden;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      z-index: 9999;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s, visibility 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      visibility: visible;
    }

    /* PWA install banner */
    #install-banner {
      display: none;
      margin: 0 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      align-items: center;
      gap: 12px;
    }

    #install-banner span {
      font-size: 13px;
      color: var(--muted);
      flex: 1;
      line-height: 1.5;
    }

    #install-banner span strong {
      color: var(--text);
      font-weight: 500;
    }

    .install-btn {
      padding: 8px 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .dismiss-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

  </style>
</head>

<body>

  <header>
    <div class="header-left">
      <div class="logo">Arham · Job Apply</div>
    </div>
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle theme">🌙</button>
  </header>

  <div class="sticky-action-bar">
    <div class="role-grid">
      <button class="role-btn odoo active" onclick="setRole('odoo', this)">Odoo</button>
      <button class="role-btn py" onclick="setRole('py', this)">Python</button>
      <button class="role-btn custom" onclick="setRole('custom', this)">Custom</button>
      <button class="role-btn send-btn" onclick="openGmail()">Send</button>
    </div>
  </div>

  <div class="form">

    <div id="install-banner">
      <span><strong>Add to Home Screen</strong><br>Install this app for quick access</span>
      <button class="install-btn" onclick="installPWA()">Install</button>
      <button class="dismiss-btn" onclick="dismissBanner()">✕</button>
    </div>

    <!-- Template fields -->
    <div id="template-fields" style="display:flex;flex-direction:column;gap:16px;">
      <div class="field">
        <label>EMAIL</label>
        <input type="email" id="to-email" placeholder="hr@company.com" oninput="refresh()" />
      </div>
      <div class="field">
        <label>Name<span style="color:var(--border)">(optional)</span></label>
        <input type="text" id="to-name" placeholder="Hiring Team" oninput="refresh()" />
      </div>
      <div class="divider"></div>
      <div>
        <div class="toggle-row" onclick="togglePreview()">
          <span>Preview email before sending</span>
          <span class="toggle-arrow" id="arrow">▼</span>
        </div>
        <div id="preview-section">
          <div class="preview-label" style="margin-top:12px;">Subject</div>
          <div class="preview-box" id="prev-subject"></div>
          <div class="preview-label" style="margin-top:12px;">Body</div>
          <div class="preview-box" id="prev-body"></div>
        </div>
      </div>
      <div class="divider"></div>
    </div>

    <!-- Custom fields -->
    <div id="custom-fields">
      <div class="field">
        <label>Recipient email</label>
        <input type="email" id="c-to-email" placeholder="hr@company.com" />
      </div>
      <div class="field">
        <label>Subject</label>
        <input type="text" id="c-subject" placeholder="Application for XYZ Position" />
      </div>
      <div class="field">
        <label>Body</label>
        <textarea id="c-body" rows="12" placeholder="Write your full email here..."></textarea>
      </div>
      <div class="divider"></div>
    </div>

    <!-- File picker field -->
    <div class="field" style="margin-bottom: 8px;">
      <label>Resume PDF</label>
      <input type="file" id="resume-file" accept="application/pdf" onchange="onFileSelected(); refresh();" style="display: none;" />
      <button class="file-picker-btn" onclick="document.getElementById('resume-file').click()" id="file-label-btn">
        Custom Resume
      </button>
    </div>

  </div>

  <div id="toast" class="toast"></div>

  <script>
    let role = 'odoo';
    let deferredPrompt = null;

    let toastQueue = [];
    let toastActive = false;
    function showToast(msg) {
      toastQueue.push(msg);
      if (!toastActive) processToastQueue();
    }
    function processToastQueue() {
      if (toastQueue.length === 0) { toastActive = false; return; }
      toastActive = true;
      const toast = document.getElementById('toast');
      toast.textContent = toastQueue.shift();
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(processToastQueue, 300);
      }, 4000);
    }

    /* ── Theme ── */
    function applyTheme(mode) {
      document.documentElement.classList.toggle('light', mode === 'light');
      document.getElementById('theme-btn').textContent = mode === 'light' ? '🌙' : '☀️';
      document.getElementById('theme-meta').setAttribute('content', mode === 'light' ? '#f5f5f3' : '#0e0e0f');
      localStorage.setItem('theme', mode);
    }
    function toggleTheme() {
      const current = document.documentElement.classList.contains('light') ? 'light' : 'dark';
      applyTheme(current === 'light' ? 'dark' : 'light');
    }
    applyTheme(localStorage.getItem('theme') || 'dark');

    /* ── PWA ── */
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-banner').style.display = 'flex';
    });
    window.addEventListener('appinstalled', () => {
      document.getElementById('install-banner').style.display = 'none';
    });
    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
        document.getElementById('install-banner').style.display = 'none';
      }
    }
    function dismissBanner() {
      document.getElementById('install-banner').style.display = 'none';
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    /* ── Role ── */
    function setRole(r, btn) {
      role = r;
      document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const isCustom = r === 'custom';
      document.getElementById('template-fields').style.display = isCustom ? 'none' : 'flex';
      document.getElementById('custom-fields').style.display = isCustom ? 'flex' : 'none';
      refresh();
    }

    function getName() { return document.getElementById('to-name').value.trim() || 'Hiring Team'; }

    function clearFields() {
      document.getElementById('to-email').value = '';
      document.getElementById('to-name').value = '';
      refresh();
    }

    function getSubject() {
      if (role === 'odoo') return 'Application for Odoo Developer Position';
      return 'Application for Python Backend Developer Position';
    }

    function getBody() {
      const name = getName();
      if (role === 'odoo') {
        return `Dear ${name},\n\nI'm writing to apply for the Odoo Developer role at your organization. I have 2 years of experience building and customizing Odoo ERP solutions (v12/v16/v18) using Python, the ORM, and QWeb.\n\nAt Binary Semantics Ltd., I've delivered custom Odoo modules, integrated third-party APIs (PAN, DL, Google Maps), built config-driven Airflow ETL pipelines, and deployed containerized services on AWS EC2 — cutting database size by 60% via an S3 migration.\n\nMy resume is attached. I'd welcome the chance to discuss how I can contribute to your team.\n\nBest regards,\nMohammad Arham\nOdoo / Python Developer\n+91 9557385029`;
      }
      return `Dear ${name},\n\nI'm writing to apply for the Python Backend Engineer role. I have 2 years of experience building scalable backend systems, REST APIs, and automated data pipelines.\n\nAt Binary Semantics Ltd., I've built async FastAPI/Flask services with sub-50ms p95 latency, designed Airflow ETL pipelines replicating PostgreSQL to AWS Athena/Redshift in near real-time, migrated storage to S3 (cutting DB size by 60%), and integrated Rasa NLU chatbots via REST webhooks.\n\nMy resume is attached. I'd welcome the chance to discuss how I can contribute to your team.\n\nBest regards,\nMohammad Arham\nPython Backend Engineer\n+91 9557385029`;
    }

    function refresh() {
      if (role !== 'custom') {
        document.getElementById('prev-subject').textContent = getSubject();
        document.getElementById('prev-body').textContent = getBody();
      }
    }
    
    function onFileSelected() {
      const fileInput = document.getElementById('resume-file');
      const btn = document.getElementById('file-label-btn');
      if (fileInput.files.length > 0) {
        btn.innerHTML = `<span>📄</span> ${fileInput.files[0].name}`;
        btn.classList.add('selected');
      } else {
        btn.innerHTML = `<span>📎</span> Select custom resume PDF...`;
        btn.classList.remove('selected');
      }
    }

    function canShareFiles() {
      if (!navigator.share || !navigator.canShare) return false;
      try {
        const file = new File(["test"], "test.pdf", { type: "application/pdf" });
        return navigator.canShare({ files: [file] });
      } catch (e) {
        return false;
      }
    }

    refresh();

    function togglePreview() {
      const sec = document.getElementById('preview-section');
      const arrow = document.getElementById('arrow');
      const open = sec.style.display === 'block';
      sec.style.display = open ? 'none' : 'block';
      arrow.classList.toggle('open', !open);
      refresh();
    }

    async function openGmail() {
      let to, subject, body;
      if (role === 'custom') {
        to = document.getElementById('c-to-email').value.trim();
        subject = document.getElementById('c-subject').value.trim();
        body = document.getElementById('c-body').value.trim();
        if (!to) { alert('Please enter the recipient email.'); return; }
        if (!subject) { alert('Please enter a subject.'); return; }
        if (!body) { alert('Please write your email body.'); return; }
      } else {
        to = document.getElementById('to-email').value.trim();
        subject = getSubject();
        body = getBody();
        if (!to) { alert('Please enter the recipient email.'); return; }
      }

      // Copy recipient email to clipboard synchronously immediately on user gesture context
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(to).catch(err => {
          console.warn("Failed to copy email: ", err);
        });
      }

      const fileInput = document.getElementById('resume-file');
      let file = null;

      // 1. Use manually selected file if present
      if (fileInput && fileInput.files.length > 0) {
        file = fileInput.files[0];
      }
      // 2. Otherwise, try to auto-load the correct resume PDF for the role
      else if (role !== 'custom') {
        try {
          const fileName = role === 'odoo' ? 'arham_odoo_2y.pdf' : 'arham_python_2y.pdf';
          const response = await fetch(`./${fileName}`);
          if (response.ok) {
            const blob = await response.blob();
            file = new File([blob], fileName, { type: 'application/pdf' });
          } else {
            console.warn(`Auto-fetch of ${fileName} returned HTTP status: ${response.status}`);
            showToast(`⚠️ Couldn't load ${fileName} (HTTP ${response.status})`);
          }
        } catch (e) {
          console.warn("Auto-fetch resume failed:", e);
          showToast(`⚠️ Resume fetch failed: ${e.message}`);
        }
      }

      // 3. Try to use Web Share API
      if (file && canShareFiles()) {
        const shareData = {
          files: [file],
          title: subject,
          text: body
        };

        if (navigator.canShare(shareData)) {
          const sendBtn = document.querySelector('.send-btn');
          const originalText = sendBtn.textContent;
          sendBtn.textContent = "Opening Gmail...";
          sendBtn.disabled = true;

          try {
            await navigator.share(shareData);
            sendBtn.textContent = originalText;
            sendBtn.disabled = false;
            clearFields();
            return;
          } catch (err) {
            sendBtn.textContent = originalText;
            sendBtn.disabled = false;
            
            // On Android Chrome, selecting an app or dismissing the menu throws a 'Share canceled' error.
            // We should exit silently here to prevent opening a duplicate mailto fallback.
            if (err.name === 'AbortError' || err.message.toLowerCase().includes('cancel') || err.message.toLowerCase().includes('abort')) {
              console.log("Web Share interface dismissed or completed.");
              return;
            }
            console.warn("Web Share failed, falling back to mailto:", err);
          }
        } else {
          console.warn("Web Share refused this share payload (files + text size), falling back to standard email.");
          showToast("⚠️ Share not supported for this file, using email fallback.");
        }
      } else {
        if (!file) {
          console.warn("No resume file loaded, falling back to standard email.");
        } else {
          console.warn("Web Share API for files is not supported on this device/context, falling back to standard email.");
        }
      }

      // 4. Fallback: standard mailto link
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(body).catch(() => {});
      }
      window.location.href = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      clearFields();
    }
  </script>
</body>

</html>
